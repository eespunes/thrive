version: 2
updates:
  # Dart/Flutter package updates (pubspec.yaml).
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      firebase:
        patterns:
          - "firebase_*"
          - "cloud_firestore"

  # Keep the GitHub Actions used by the workflows current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
