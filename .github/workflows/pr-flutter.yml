name: PR Flutter Quality

# No `paths:` filter: the old one meant a PR touching only firestore.rules,
# firebase.json or web/ ran no CI at all. The Flutter cache keeps a full run
# cheap enough to always execute.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-flutter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned so a new stable release can't break CI overnight and CI
          # matches the version the app is developed against. Bump
          # deliberately (here and in version-bump-on-main.yml together).
          flutter-version: 3.44.4
          cache: true

      - name: Validate Flutter project files
        run: |
          test -f pubspec.yaml || (echo "Missing pubspec.yaml" && exit 1)

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis (lints)
        run: flutter analyze --fatal-infos

      - name: Run tests
        # --timeout: a single stalling test (e.g. a pumpAndSettle that never
        # settles) used to hang this step for 10+ minutes per occurrence;
        # failing it fast NAMES the offending test in the log instead. The
        # whole suite takes ~2 min on these runners, so 3 min per test is
        # generous headroom.
        run: flutter test --coverage --timeout 180s
        timeout-minutes: 15

      - name: Install coverage tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lcov

      - name: Check code coverage
        run: |
          if [ -f coverage/lcov.info ]; then
            # Generate coverage report and extract percentage
            COVERAGE=$(lcov --summary coverage/lcov.info 2>/dev/null | grep "lines" | awk '{print $2}' | sed 's/%//')
            echo "Code coverage: ${COVERAGE}%"
            
            # Check if coverage meets 95% threshold
            THRESHOLD=95
            if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
              echo "❌ Code coverage is ${COVERAGE}%, below the required ${THRESHOLD}%"
              exit 1
            else
              echo "✅ Code coverage is ${COVERAGE}%, meets the required ${THRESHOLD}%"
            fi
          else
            echo "⚠️  Coverage file not found. Ensure tests are run with --coverage flag."
            exit 1
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Comment PR with coverage result
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let coverage = 'N/A';
            let status = '⚠️';
            
            if (fs.existsSync('coverage/lcov.info')) {
              const { execSync } = require('child_process');
              try {
                const output = execSync('lcov --summary coverage/lcov.info 2>/dev/null || echo ""', { encoding: 'utf-8' });
                const match = output.match(/lines.*?:\s*([\d.]+)%/);
                if (match) {
                  coverage = match[1];
                  status = parseFloat(coverage) >= 95 ? '✅' : '❌';
                }
              } catch (e) {
                console.log('Could not parse coverage');
              }
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${status} **Code Coverage:** ${coverage}% (Target: 95%)`
            });
