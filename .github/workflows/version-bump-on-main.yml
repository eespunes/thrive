name: Auto Bump App Version

on:
  push:
    branches:
      - main
    paths-ignore:
      - "pubspec.yaml"

permissions:
  contents: write

concurrency:
  group: version-bump-main
  cancel-in-progress: false

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MAIN_PUSH_PAT }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate app before bumping version
        run: |
          flutter analyze --fatal-infos
          flutter test

      - name: Bump app version
        run: |
          set -euo pipefail

          version_name="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+$/\1/p' pubspec.yaml | head -n1)"
          build_number="$(sed -nE 's/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+([0-9]+)$/\1/p' pubspec.yaml | head -n1)"

          if [[ -z "${version_name}" || -z "${build_number}" ]]; then
            echo "Could not parse version from pubspec.yaml"
            exit 1
          fi

          new_build_number="$((build_number + 1))"
          new_version="${version_name}+${new_build_number}"

          sed -i.bak -E "s/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$/version: ${new_version}/" pubspec.yaml
          rm -f pubspec.yaml.bak
          echo "Bumped version to ${new_version}"

      - name: Commit and push version bump
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No version changes to commit."
            exit 0
          fi

          new_version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+\+[0-9]+)$/\1/p' pubspec.yaml | head -n1)"
          if [[ -z "${new_version}" ]]; then
            echo "Could not read new version from pubspec.yaml"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore(version): bump to ${new_version}"
          git push
