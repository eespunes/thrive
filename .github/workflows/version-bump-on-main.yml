name: Auto Bump App Version

on:
  push:
    branches:
      - main
    paths-ignore:
      - "pubspec.yaml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: version-bump-main
  cancel-in-progress: false

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MAIN_PUSH_PAT }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Keep in sync with pr-flutter.yml.
          flutter-version: 3.44.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate app before bumping version
        run: |
          flutter analyze --fatal-infos
          flutter test

      - name: Determine semantic version bump
        id: version-bump
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pulls = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: context.sha,
            });
            const pr = pulls.data.find((item) => item.merged_at) ?? pulls.data[0];
            const labels = (pr?.labels ?? []).map((label) => label.name.toLowerCase());
            const headMessage = context.payload.head_commit?.message ?? '';
            const text = [pr?.title, pr?.body, headMessage].filter(Boolean).join('\n');

            const hasAnyLabel = (names) => labels.some((label) => names.includes(label));
            let bump = 'patch';
            let reason = 'default patch bump';

            if (hasAnyLabel(['version: major', 'semver: major', 'semver-major', 'major'])) {
              bump = 'major';
              reason = 'major version label';
            } else if (hasAnyLabel(['version: minor', 'semver: minor', 'semver-minor', 'minor'])) {
              bump = 'minor';
              reason = 'minor version label';
            } else if (hasAnyLabel(['version: patch', 'semver: patch', 'semver-patch', 'patch'])) {
              bump = 'patch';
              reason = 'patch version label';
            } else if (/BREAKING CHANGE|^[a-z]+(?:\([^)]+\))?!:/im.test(text)) {
              bump = 'major';
              reason = 'breaking-change marker';
            } else if (/^feat(?:\([^)]+\))?:/im.test(text) || /\b(feature|implement|implements|implemented|add|adds|added|new)\b/i.test(text)) {
              bump = 'minor';
              reason = 'feature-style merged changes';
            }

            core.setOutput('bump', bump);
            core.setOutput('reason', reason);
            core.notice(`Using ${bump} version bump: ${reason}`);

      - name: Bump app version
        env:
          VERSION_BUMP: ${{ steps.version-bump.outputs.bump }}
          VERSION_REASON: ${{ steps.version-bump.outputs.reason }}
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          version_name="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+$/\1/p' pubspec.yaml | head -n1)"
          build_number="$(sed -nE 's/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+([0-9]+)$/\1/p' pubspec.yaml | head -n1)"
          base_version_name=""
          base_build_number="0"

          if [[ -n "${PREVIOUS_SHA}" && "${PREVIOUS_SHA}" != "0000000000000000000000000000000000000000" ]] &&
             git cat-file -e "${PREVIOUS_SHA}:pubspec.yaml" 2>/dev/null; then
            base_pubspec="$(git show "${PREVIOUS_SHA}:pubspec.yaml")"
            base_version_name="$(printf '%s\n' "${base_pubspec}" | sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+$/\1/p' | head -n1)"
            base_build_number="$(printf '%s\n' "${base_pubspec}" | sed -nE 's/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+([0-9]+)$/\1/p' | head -n1)"
          fi
          base_build_number="${base_build_number:-0}"

          if [[ -z "${version_name}" || -z "${build_number}" ]]; then
            echo "Could not parse version from pubspec.yaml"
            exit 1
          fi

          semver_gt() {
            IFS='.' read -r a_major a_minor a_patch <<< "$1"
            IFS='.' read -r b_major b_minor b_patch <<< "$2"
            if (( a_major != b_major )); then (( a_major > b_major )); return; fi
            if (( a_minor != b_minor )); then (( a_minor > b_minor )); return; fi
            (( a_patch > b_patch ))
          }

          if [[ -n "${base_version_name}" ]] && semver_gt "${version_name}" "${base_version_name}"; then
            new_version_name="${version_name}"
            echo "Keeping PR-provided app version ${new_version_name} (base was ${base_version_name})"
          else
            IFS='.' read -r major minor patch <<< "${version_name}"
            case "${VERSION_BUMP}" in
              major)
                major="$((major + 1))"
                minor=0
                patch=0
                ;;
              minor)
                minor="$((minor + 1))"
                patch=0
                ;;
              patch)
                patch="$((patch + 1))"
                ;;
              *)
                echo "Unsupported version bump '${VERSION_BUMP}'"
                exit 1
                ;;
            esac
            new_version_name="${major}.${minor}.${patch}"
          fi

          if (( base_build_number > build_number )); then
            new_build_number="$((base_build_number + 1))"
          else
            new_build_number="$((build_number + 1))"
          fi
          new_version="${new_version_name}+${new_build_number}"

          sed -i.bak -E "s/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$/version: ${new_version}/" pubspec.yaml
          rm -f pubspec.yaml.bak
          echo "Bumped version to ${new_version} (${VERSION_BUMP}: ${VERSION_REASON})"

      - name: Commit and push version bump
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No version changes to commit."
            exit 0
          fi

          new_version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+\+[0-9]+)$/\1/p' pubspec.yaml | head -n1)"
          if [[ -z "${new_version}" ]]; then
            echo "Could not read new version from pubspec.yaml"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore(version): bump to ${new_version}"
          git push
