name: Code Coverage Check (95%)

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - ".github/workflows/coverage-check.yml"
  workflow_run:
    workflows: ["PR Flutter Quality"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  coverage-report:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Install coverage tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lcov

      - name: Generate coverage report
        run: |
          # Generate HTML coverage report
          genhtml coverage/lcov.info -o coverage/html
          echo "Coverage report generated in coverage/html/"

      - name: Calculate coverage percentage
        id: coverage
        run: |
          if [ -f coverage/lcov.info ]; then
            # Extract line coverage percentage
            COVERAGE=$(lcov --summary coverage/lcov.info 2>/dev/null | grep "lines" | awk '{print $2}' | sed 's/%//')
            echo "coverage_percent=$COVERAGE" >> $GITHUB_OUTPUT
            
            # Check if coverage meets 95% threshold
            THRESHOLD=95
            if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
              echo "status=FAILED" >> $GITHUB_OUTPUT
              echo "message=Code coverage is ${COVERAGE}% (Target: 95%)" >> $GITHUB_OUTPUT
              exit 1
            else
              echo "status=PASSED" >> $GITHUB_OUTPUT
              echo "message=Code coverage is ${COVERAGE}% (Target: 95%)" >> $GITHUB_OUTPUT
            fi
          else
            echo "status=MISSING" >> $GITHUB_OUTPUT
            echo "message=Coverage file not found" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_id }}
          path: coverage/
          if-no-files-found: ignore

      - name: Comment PR with coverage result
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = '${{ steps.coverage.outputs.status }}';
            const message = '${{ steps.coverage.outputs.message }}';
            const coverage = '${{ steps.coverage.outputs.coverage_percent }}';
            
            let emoji = '⚠️';
            let color = 'orange';
            
            if (status === 'PASSED') {
              emoji = '✅';
              color = 'green';
            } else if (status === 'FAILED') {
              emoji = '❌';
              color = 'red';
            }
            
            const body = `${emoji} **Code Coverage Check**
            
| Metric | Value |
|--------|-------|
| Coverage | ${coverage}% |
| Target | 95% |
| Status | ${status} |

${message}

[View Coverage Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Create check run
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = '${{ steps.coverage.outputs.status }}';
            const coverage = '${{ steps.coverage.outputs.coverage_percent }}';
            
            const checkRunParams = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: '95% Code Coverage',
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion: status === 'PASSED' ? 'success' : status === 'FAILED' ? 'failure' : 'neutral',
              output: {
                title: 'Code Coverage Analysis',
                summary: `Coverage: ${coverage}% (Target: 95%)`,
                text: status === 'PASSED' 
                  ? '✅ Code coverage meets the 95% threshold' 
                  : status === 'FAILED'
                  ? `❌ Code coverage (${coverage}%) is below the 95% threshold`
                  : '⚠️ Could not determine code coverage'
              }
            };
            
            await github.rest.checks.create(checkRunParams);

  check-on-artifact:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run'
    
    steps:
      - name: Download coverage artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: pr-flutter.yml
          name: coverage-lcov

      - name: Install coverage tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lcov

      - name: Check coverage from artifact
        if: hashFiles('lcov.info') != ''
        run: |
          if [ -f lcov.info ]; then
            COVERAGE=$(lcov --summary lcov.info 2>/dev/null | grep "lines" | awk '{print $2}' | sed 's/%//')
            echo "Code coverage: ${COVERAGE}%"
            
            THRESHOLD=95
            if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
              echo "❌ Code coverage is ${COVERAGE}%, below the required 95%"
              exit 1
            else
              echo "✅ Code coverage is ${COVERAGE}%, meets the required 95%"
            fi
          fi
