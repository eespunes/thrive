name: Firestore rules tests

on:
  pull_request:
    paths:
      - firestore.rules
      - firebase.json
      - test/rules/**
      - .github/workflows/rules-tests.yml
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - test/rules/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install firebase-tools
        run: npm install -g firebase-tools
      - name: Install test deps
        run: npm ci
        working-directory: test/rules
      - name: Run rules tests
        run: npm test
        working-directory: test/rules
