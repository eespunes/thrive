*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#dfe3ea;color:#0f172a;-webkit-font-smoothing:antialiased}
.thv-scroll::-webkit-scrollbar{width:0;height:0}
.thv-scroll{scrollbar-width:none;-ms-overflow-style:none}
input,button{font-family:inherit}
@keyframes thvFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes thvSheet{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes thvOverlay{from{opacity:0}to{opacity:1}}
@keyframes thvToast{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes thvScan{from{top:12%}to{top:82%}}
</style>
<script src="budget-data.js"></script>
</helmet>

<div style="min-height:100vh;width:100%;display:flex;justify-content:center;align-items:flex-start;padding:34px 16px;background:radial-gradient(130% 90% at 50% -10%,#eef1f6,#dadfe8)">
  <div style="width:404px;max-width:100%;background:#0d1117;border-radius:52px;padding:12px;box-shadow:0 50px 90px -30px rgba(15,23,42,.55),0 0 0 1px rgba(15,23,42,.08),inset 0 0 0 2px #23262d;position:relative">
    <div style="position:relative;width:100%;height:846px;background:#f4f6f9;border-radius:41px;overflow:hidden;display:flex;flex-direction:column">

      <div style="position:relative;flex:none;padding:13px 28px 4px;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;color:#0f172a;z-index:5">
        <span style="letter-spacing:.3px">{{ clock }}</span>
        <span style="position:absolute;left:50%;top:11px;transform:translateX(-50%);width:112px;height:27px;background:#0d1117;border-radius:999px"></span>
        <span style="display:flex;align-items:center;gap:6px">{{ signalIcon }}{{ wifiIcon }}{{ batteryIcon }}</span>
      </div>

      <div style="flex:none;padding:8px 18px 12px;background:#f4f6f9;z-index:4">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:13px">
          <div style="display:flex;align-items:center;gap:10px;min-width:0">
            <span onClick="{{ onProfile }}" title="Your profile" style="width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#46B873 0%,#0FA08E 52%,#1684B4 100%);box-shadow:0 5px 14px -3px rgba(15,138,118,.6);flex:none;cursor:pointer;overflow:hidden">{{ logoMark }}</span>
            <div style="display:flex;flex-direction:column;line-height:1.12;min-width:0">
              <span style="font-size:15px;font-weight:800;letter-spacing:-.3px;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ screenTitle }}</span>
              <span style="font-size:11px;font-weight:600;color:#94a0b0;white-space:nowrap">{{ screenSubtitle }}</span>
            </div>
          </div>
          {{ switcherEl }}
        </div>
        {{ subHeaderEl }}
      </div>

      <div class="thv-scroll" style="flex:1;overflow-y:auto;overflow-x:hidden;background:#f4f6f9">
        {{ bodyEl }}
      </div>

      {{ fabEl }}
      {{ navEl }}

      <div style="flex:none;height:22px;display:grid;place-items:center;background:#f4f6f9"><span style="width:128px;height:5px;border-radius:999px;background:#0f172a;opacity:.22"></span></div>

      {{ overlayEl }}
      {{ confirmEl }}
      {{ toastEl }}
      {{ authEl }}
      {{ onboardEl }}
    </div>
  </div>
</div>

/* ============================ helpers ============================ */
function num(v){if(typeof v==='number')return isNaN(v)?0:v;if(typeof v==='string'){if(v.trim()==='-'||v.trim()==='')return 0;const n=parseFloat(v.replace(',','.'));return isNaN(n)?0:n;}return 0;}
function eur(n,cents){if(n==null||isNaN(n))n=0;const neg=n<0;n=Math.abs(n);let s=(cents===false?String(Math.round(n)):n.toFixed(2));let p=s.split('.');let i=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');return (neg?'\u2212':'')+'\u20ac\u00A0'+i+(p[1]?(','+p[1]):'');}
function markerShow(v){if(v==null)return '';const s=String(v).trim();if(/^\d{4,}$/.test(s))return '';return s==='-'?'':s;}
function untilLabel(v){if(v==null)return null;if(typeof v==='string'){const t=v.trim();return (t===''||t==='-')?null:t;}const serial=num(v);if(serial<=0)return null;const d=new Date(Date.UTC(1899,11,30)+serial*86400000);return String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCFullYear()%100).padStart(2,'0');}
function untilState(label,mIdx,year){const p=(label||'').split('-');if(p.length!==2)return 'future';const mm=parseInt(p[0],10),yy=2000+parseInt(p[1],10);if(isNaN(mm)||isNaN(yy))return 'future';const diff=(yy-year)*12+(mm-1-mIdx);if(diff<0)return 'ended';if(diff<=6)return 'soon';return 'future';}

function accForLabel(label){const u=(label||'').toUpperCase();if(u.indexOf('EVA')>=0)return 'eva';if(u.indexOf('ERIK')>=0)return 'erik';return 'shared';}

function pad2(n){return String(n).padStart(2,'0');}
function isoOf(y,m,d){return y+'-'+pad2(m)+'-'+pad2(d);}
function parseISO(s){const p=(s||'').split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2]));}
function isoFromDate(dt){return dt.getUTCFullYear()+'-'+pad2(dt.getUTCMonth()+1)+'-'+pad2(dt.getUTCDate());}
function addDays(iso,n){const d=parseISO(iso);d.setUTCDate(d.getUTCDate()+n);return isoFromDate(d);}
function addMonths(iso,n){const d=parseISO(iso);d.setUTCMonth(d.getUTCMonth()+n);return isoFromDate(d);}
function dowMon(iso){return (parseISO(iso).getUTCDay()+6)%7;}

      this.setState({cats},()=>this.persist());this.mutate(d=>{const m=d[this.state.year][MK[this.state.monthIdx]];if(m&&!m.closed){if(!m.caps)m.caps={};if(cap==null||cap<=0)delete m.caps[s.key];else m.caps[s.key]=cap;}},()=>{this.closeSheet();this.flash('Block saved');});return;}

  doCopy(fromYear,from,toYear,to){
    if(fromYear===toYear&&from===to)return;
    if(this.isClosed(to,toYear)){this.flash('Destination is closed');return;}
    this.ensureYear(fromYear);this.ensureYear(toYear);
    const srcCats=this.catsForMonth(from,fromYear);
    const newCats=this.state.cats.map(c=>Object.assign({},c));
    this.mutate(d=>{
      if(!d[fromYear])return;const src=d[fromYear][MK[from]];if(!src)return;
      const dst={income:(src.income||[]).map(it=>Object.assign({},it,{id:uid()})),blocks:{},caps:{},closed:false};
      srcCats.forEach(c=>{
        const items=((src.blocks&&src.blocks[c.key])||[]).map(it=>Object.assign({},it,{id:uid()}));
        let tgtKey=c.key;
        if(c.temporary){tgtKey=c.key.replace(/_[a-z0-9]+$/,'')+'_'+uid().slice(0,4);newCats.push(Object.assign({},c,{key:tgtKey,temporary:true,ownerYear:toYear,ownerMonthIdx:to}));}
        dst.blocks[tgtKey]=items;
        if(src.caps&&src.caps[c.key]!=null)dst.caps[tgtKey]=src.caps[c.key];
      });
      newCats.filter(c=>!c.temporary).forEach(c=>{if(!dst.blocks[c.key])dst.blocks[c.key]=[];});
      d[toYear][MK[to]]=dst;
    },()=>{this.setState({cats:newCats},()=>this.persist());this.closeSheet();this.flash(MS[from]+' '+fromYear+' copied to '+MS[to]+' '+toYear);});}
  resetAll(){try{localStorage.removeItem('thrive.v3');}catch(e){}this.setState({ready:false,accounts:DEF_ACCOUNTS.map(a=>Object.assign({},a)),cats:DEF_CATS.map(c=>Object.assign({},c)),data:{},collapsed:{},sheet:null},()=>this.boot());}

          E('span',{style:{width:'20px',height:'20px',borderRadius:'50%',display:'grid',placeItems:'center',fontSize:'11px',fontWeight:800,color:isToday?'#fff':B.ink,background:isToday?B.primary:'transparent'}},d.day)),
        E('span',{style:{display:'flex',flexDirection:'column',gap:'3px',marginTop:'auto'}},bar(d.inSum,B.green),bar(d.outSum,B.red))));});
    const legend=(col,label)=>E('span',{key:label,style:{display:'inline-flex',alignItems:'center',gap:'5px',fontSize:'10px',fontWeight:700,color:B.soft2}},E('span',{style:{width:'12px',height:'3px',borderRadius:'2px',background:col}}),label);
    return E('div',{style:{background:'#fff',border:'1px solid '+B.line,borderRadius:'18px',padding:'12px 10px',marginBottom:'11px',boxShadow:'0 10px 26px -20px rgba(16,24,40,.28)'}},
      E('div',{style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'3px',marginBottom:'5px'}},WK.map((w,i)=>E('span',{key:i,style:{textAlign:'center',fontSize:'10px',fontWeight:800,color:i>4?B.muted:B.soft2}},w))),
      E('div',{style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'3px'}},cells),
      E('div',{style:{display:'flex',gap:'12px',justifyContent:'center',flexWrap:'wrap',marginTop:'11px',paddingTop:'10px',borderTop:'1px solid '+B.faint}},
        legend(B.green,'Money in'),legend(B.red,'Money out'),
        E('span',{key:'od',style:{display:'inline-flex',alignItems:'center',gap:'5px',fontSize:'10px',fontWeight:700,color:B.soft2}},E('span',{style:{width:'11px',height:'11px',borderRadius:'4px',border:'1px solid #fcd9a5',background:'#fffaf2'}}),'Not ticked off')));
  }
  flowNext(f,locked){
    const from=(f.td==null)?1:f.td;const out=[];
    f.days.forEach(d=>{if(d.day<from)return;d.in.concat(d.out).forEach(r=>{if(out.length<4)out.push({day:d.day,r:r});});});
    if(!out.length)return null;
    return E('div',{style:{background:'#fff',border:'1px solid '+B.line,borderRadius:'18px',padding:'0 14px 11px',marginBottom:'11px'}},
      E('div',{style:{fontSize:'11px',fontWeight:800,letterSpacing:'.3px',color:B.muted,textTransform:'uppercase',padding:'12px 0 5px'}},'Next up'),
      out.map(o=>this.flowRow(o.r,locked,o.day)));
  }
  flowTimeline(f,locked){
    const active=f.days.filter(d=>d.in.length||d.out.length);
    if(!active.length)return E('div',{style:{background:'#fff',border:'1px solid '+B.line,borderRadius:'18px',padding:'28px',textAlign:'center',fontSize:'12.5px',fontWeight:600,color:B.muted,marginBottom:'11px'}},'Nothing with a date this month.');
    return E('div',{style:{display:'flex',flexDirection:'column',gap:'10px',marginBottom:'11px'}},active.map(d=>{
      const wd=WDFULL[dowMon(d.iso)].slice(0,3);const isToday=f.td===d.day;
      return E('div',{key:d.day,style:{background:'#fff',border:'1px solid '+(isToday?B.primary:B.line),borderRadius:'18px',padding:'11px 14px 5px',boxShadow:'0 10px 26px -22px rgba(16,24,40,.3)'}},
        E('div',{style:{display:'flex',alignItems:'center',gap:'11px',paddingBottom:'7px'}},
          E('span',{style:{flex:'none',width:'38px',height:'38px',borderRadius:'12px',background:isToday?B.primary:B.faint,color:isToday?'#fff':B.ink,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}},
            E('span',{style:{fontSize:'13px',fontWeight:800,lineHeight:1}},d.day),
            E('span',{style:{fontSize:'8px',fontWeight:800,letterSpacing:'.4px',opacity:.72,textTransform:'uppercase'}},wd)),
          E('span',{style:{flex:1,minWidth:0}},
            E('span',{style:{display:'block',fontSize:'13.5px',fontWeight:800,color:d.net>=0?B.green:B.ink,fontVariantNumeric:'tabular-nums'}},(d.net>=0?'+':'\u2212')+eur(Math.abs(d.net),false)),
            E('span',{style:{display:'block',fontSize:'10.5px',fontWeight:600,color:B.muted}},'Balance after \u00b7 '+eur(d.bal,false))),
          isToday?E('span',{style:{flex:'none',background:B.soft,color:B.deep,fontSize:'10px',fontWeight:800,borderRadius:'999px',padding:'4px 9px'}},'Today'):null),
        d.in.concat(d.out).map(r=>this.flowRow(r,locked)));}));
  }
  flowUnscheduled(f,locked){
    if(!f.un.length)return null;
    return E('div',{style:{background:'#fff',border:'1px dashed #d8dee8',borderRadius:'18px',padding:'0 14px 11px',marginBottom:'11px'}},
      E('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 0 3px'}},
        E('span',{style:{fontSize:'11px',fontWeight:800,letterSpacing:'.3px',color:B.muted,textTransform:'uppercase'}},'No date yet \u00b7 '+f.un.length),
        E('span',{style:{fontSize:'12.5px',fontWeight:800,color:B.ink,fontVariantNumeric:'tabular-nums'}},eur(f.unSum,false))),
      E('div',{style:{fontSize:'11px',fontWeight:600,color:B.muted,lineHeight:1.5,paddingBottom:'1px'}},'Not on the calendar and not in the projection. Tap one to give it a day.'),
      f.un.map(r=>this.flowRow(r,locked)));
  }
  flowTile(label,val,col){return E('div',{style:{flex:1,background:B.faint,borderRadius:'13px',padding:'10px 11px'}},
    E('div',{style:{fontSize:'9.5px',fontWeight:800,letterSpacing:'.4px',color:B.muted,textTransform:'uppercase',marginBottom:'3px'}},label),
    E('div',{style:{fontSize:'14px',fontWeight:800,color:col,fontVariantNumeric:'tabular-nums'}},val));}
  sheetFlowDay(s){
    const f=this.flowModel();const d=f.days[Math.min(s.day,f.dim)-1];const locked=f.c.closed;
    const rows=d.in.concat(d.out);
    return E('div',{style:{overflowY:'auto'}},
      this.sheetHead(this.ord(d.day)+' '+MEN[this.state.monthIdx],WDFULL[dowMon(d.iso)]+(f.td===d.day?' \u00b7 today':'')),
      E('div',{style:{display:'flex',gap:'8px'}},
        this.flowTile('In','+'+eur(d.inSum,false),B.green),
        this.flowTile('Out','\u2212'+eur(d.outSum,false),B.red),
        this.flowTile('Balance after',eur(d.bal,false),d.bal<0?B.red:B.ink)),
      rows.length?E('div',{style:{marginTop:'9px'}},rows.map(r=>this.flowRow(r,locked))):E('div',{style:{padding:'24px 0 8px',textAlign:'center',fontSize:'12.5px',fontWeight:600,color:B.muted}},'No money moves on this day.'),
      rows.length?E('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',gap:'6px',fontSize:'11px',fontWeight:600,color:B.muted,padding:'13px 0 2px'}},ic('check',13,2.6),'Tap the box to tick off \u00b7 tap a row to edit'):null);
  }
  sheetOpenBal(s){
    const cur=s._v!=null?s._v:String(this.openBal()).replace('.',',');
    return E('div',null,this.sheetHead('Start balance',MEN[this.state.monthIdx]+' '+this.state.year),
      E('div',{style:{fontSize:'12px',fontWeight:600,color:B.soft2,lineHeight:1.55,marginBottom:'14px'}},'What sits on your accounts on the 1st? The projection and the lowest point are counted from here.'),
      this.field('Balance (\u20ac)',this.inp(cur,(e)=>this.setF({_v:e.target.value}),'0,00','number')),
      this.primaryBtn('Save start balance',()=>this.saveOpenBal(cur)));
  }
  renderFlow(){
    const f=this.flowModel();const locked=f.c.closed;const tl=(this.state.flowView==='timeline');
    return E('div',{style:{padding:'4px 14px 30px'}},
      locked?this.closedBanner():null,
      this.flowSummary(f),
      this.flowAlert(f,locked),
      tl?this.flowTimeline(f,locked):this.flowCalendar(f),
      tl?null:this.flowNext(f,locked),
      this.flowUnscheduled(f,locked));
  }
  renderToast(){if(!this.state.toast)return null;return E('div',{style:{position:'absolute',left:'50%',bottom:'70px',transform:'translateX(-50%)',zIndex:60,background:'#0f172a',color:'#fff',fontSize:'12.5px',fontWeight:700,padding:'10px 16px',borderRadius:'12px',boxShadow:'0 12px 28px -8px rgba(0,0,0,.4)',animation:'thvToast .25s ease',display:'flex',alignItems:'center',gap:'7px'}},ic('check',14,2.8,'#4ade80'),this.state.toast);}
}
</script>
</body>
</html>
